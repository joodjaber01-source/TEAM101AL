<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUI Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 50vw;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: transparent;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            padding-top: 3px;
        }
        .text-container {
            text-align: center;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px solid #00ccff;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
            backdrop-filter: blur(3px);
        }
        .main-text {
            font-size: 1.2em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff0066, #ffcc00, #00ffcc, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }
        .sub-text {
            font-size: 0.6em;
            color: #ffffff;
            margin-top: 2px;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #ff0066, 0 0 10px #ff0066; }
            to { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; }
        }
    </style>
</head>
<body>
    <div class="text-container">
        <div class="main-text">discord.gg\mks</div>
        <div class="sub-text"> MAX </div>
    </div>
</body>
</html>
